# GitHub Actions workflow — builds and deploys the Next.js site to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cv_updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out published CVs
        uses: actions/checkout@v4
        with:
          repository: esezak/autoCV
          ref: build
          token: ${{ secrets.AUTOCV_READ_TOKEN }}
          path: .autocv-build
          persist-credentials: false

      - name: Install the latest CVs
        run: |
          test -s .autocv-build/Ege_Sezak_Resume_EN.pdf
          test -s .autocv-build/Ege_Sezak_Resume_TR.pdf
          mkdir -p public/resumes
          cp .autocv-build/Ege_Sezak_Resume_EN.pdf public/resumes/
          cp .autocv-build/Ege_Sezak_Resume_TR.pdf public/resumes/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.homepage }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
